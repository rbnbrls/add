services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-add}
      POSTGRES_USER: ${POSTGRES_USER:-add}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-add}
    volumes:
      - add_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U add -d add"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-add}:${POSTGRES_PASSWORD:-add}@db:5432/${POSTGRES_DB:-add}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:3000}
      ADD_API_TOKEN: ${ADD_API_TOKEN:-change-me}
      LOCAL_LOGIN_PASSWORD: ${LOCAL_LOGIN_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-change-this-session-secret}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      HA_WEBHOOK_URL: ${HA_WEBHOOK_URL:-}
      HA_WEBHOOK_TOKEN: ${HA_WEBHOOK_TOKEN:-}
      HA_CONTEXT_URL: ${HA_CONTEXT_URL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_CREDENTIAL_PROVIDER: ${LLM_CREDENTIAL_PROVIDER:-llm}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports: ["8000:8000"]
  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://$$(hostname):3000/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports: ["3000:3000"]
volumes:
  add_postgres:

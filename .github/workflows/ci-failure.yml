# ── CI Failure Issue Creator (standalone copy) ────────────────────────────────
#
# Direct-copy mode: the whole workflow lives in this repository instead of
# delegating to a reusable workflow.
#
# Why: THIS REPOSITORY IS PUBLIC, and a public repository may only call reusable
# workflows hosted in other *public* repositories. The centrally-maintained copy
# lives in the private repository rbnbrls/coolify-monitor, so a `uses:` caller
# installed here could never resolve it: it would start-fail with 0 jobs
# (`conclusion=startup_failure`) on every event, forever.
#
# Generated by deploy/install-ci-failure-workflow.py. Everything below
# `name:` is the central workflow verbatim except the `workflows:` filter, which
# lists THIS repository's workflow names — re-run the script to refresh it.
#
# `workflows:` is REQUIRED for the workflow_run trigger. Removing it makes
# GitHub treat this file as invalid: it records a 0-job startup failure on every
# push and the workflow never runs.
#
# Required permissions: `issues: write` (to create the issue) and `actions: read`
# (to fetch the failed run's jobs) — set on the job below.
#
# Docs: https://github.com/rbnbrls/coolify-monitor/blob/main/deploy/README.md
# ─────────────────────────────────────────────────────────────────────────────

name: Create issue on CI failure

on:
  # `workflows:` is required: a `workflow_run` trigger without it makes the
  # whole file unparseable for GitHub Actions, which then records a 0-job
  # startup failure on every push and never runs this workflow. Measured
  # 2026-09-20: 7 such runs here (first 30070011085, last 35512493933), 41 in
  # coolify-deployment-webhook, 7 in spaartrack.nl, 45 in
  # competitie-planner.nl. List the *names* (`name:` field, not the path) of the
  # workflows whose failures should open an issue.
  workflow_run:
    workflows:
      - "Build, test, promote"
    types:
      - completed

jobs:
  create-issue:
    if: >
      github.event.workflow_run.conclusion == 'failure'
      || github.event.workflow_run.conclusion == 'timed_out'
      || github.event.workflow_run.conclusion == 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
    steps:
      - name: Create issue on CI failure
        uses: actions/github-script@v8
        id: create-issue
        with:
          script: |
            const run = context.payload.workflow_run;
            const repo = context.repo;
            const label = 'ci-failure';
            const runId = run.id;
            const runNumber = run.run_number;
            const workflowName = run.name;
            const branch = run.head_branch;
            const sha = run.head_sha;
            const runUrl = run.html_url;
            const event = run.event;
            const conclusion = run.conclusion;

            // ── 1. Fetch job details for richer issue content ────────────
            let failedJobs = [];
            try {
              const jobsResp = await github.rest.actions.listJobsForWorkflowRun({
                owner: repo.owner,
                repo: repo.repo,
                run_id: runId,
              });
              failedJobs = jobsResp.data.jobs
                .filter(j => j.conclusion === 'failure' || j.conclusion === 'timed_out' || j.conclusion === 'cancelled')
                .map(j => ({ name: j.name, conclusion: j.conclusion, id: j.id }));
            } catch (e) {
              console.warn('Could not fetch job details:', e.message);
            }

            // ── 2. Dedup: search for existing open issue with same run ID ─
            const dedupMarker = `<!-- ci-failure-run:${runId} -->`;
            let existingIssue = null;
            try {
              const searchResp = await github.rest.search.issuesAndPullRequests({
                q: `"${dedupMarker}" repo:${repo.owner}/${repo.repo} is:issue is:open label:${label}`,
                per_page: 1,
              });
              if (searchResp.data.items.length > 0) {
                existingIssue = searchResp.data.items[0];
              }
            } catch (e) {
              console.warn('Dedup search failed (may proceed):', e.message);
            }

            if (existingIssue) {
              // ── Existing issue found — add a comment with updated info ─
              await github.rest.issues.createComment({
                owner: repo.owner,
                repo: repo.repo,
                issue_number: existingIssue.number,
                body: [
                  `**Re-failure notice** — workflow run #${runNumber} failed again.`,
                  '',
                  `**Workflow:** ${workflowName}`,
                  `**Branch:** \`${branch}\``,
                  `**Run:** ${runUrl}`,
                  `**Conclusion:** \`${conclusion}\``,
                  `**Timestamp:** ${new Date().toISOString()}`,
                  '',

                  failedJobs.length > 0
                    ? '### Failed jobs\n\n' +
                      '| Job | Status |\n' +
                      '|-----|--------|\n' +
                      failedJobs.map(j => `| ${j.name} | ${j.conclusion} |`).join('\n')
                    : '',

                  '',
                  dedupMarker,
                ].join('\n'),
              });
              console.log(`Commented on existing issue #${existingIssue.number}`);
              return { action: 'commented', issue_number: existingIssue.number };
            }

            // ── 3. Build issue title ─────────────────────────────────────
            const title = `[CI Failure] ${workflowName} #${runNumber} (${branch})`;

            // ── 4. Build issue body ──────────────────────────────────────
            const commitMessage = run.head_commit
              ? (run.head_commit.message || '').split('\n')[0]
              : '(not available)';

            const body = [
              '## CI Failure Report',
              '',
              `**Workflow:** ${workflowName}`,
              `**Run:** [#${runNumber}](${runUrl})`,
              `**Branch:** \`${branch}\``,
              `**Commit:** \`${sha}\``,
              `**Commit message:** ${commitMessage}`,
              `**Triggered by:** \`${event}\``,
              `**Conclusion:** \`${conclusion}\``,
              '',

              failedJobs.length > 0
                ? '### Failed Jobs\n\n' +
                  '| Job | Status |\n' +
                  '|-----|--------|\n' +
                  failedJobs.map(j => `| ${j.name} | ${j.conclusion} |`).join('\n')
                : '### Failed Jobs\n\n_(job details could not be fetched — see the workflow run page for details)_',
              '',

              run.head_commit && run.head_commit.author
                ? `**Author:** ${run.head_commit.author.name || run.head_commit.author.email || 'unknown'}`
                : '',

              '',
              '### Logs',
              '',
              `🔗 [View workflow run](${runUrl})`,
              '',
              '---',
              '',
              'Created automatically by the `ci-failure-issue` workflow.',
              '',
              dedupMarker,
            ].filter(l => l !== '').join('\n');

            // ── 5. Create the issue ──────────────────────────────────────
            const created = await github.rest.issues.create({
              owner: repo.owner,
              repo: repo.repo,
              title: title,
              body: body,
              labels: [label],
            });
            console.log(`Created issue #${created.data.number}: ${created.data.html_url}`);
            return { action: 'created', issue_number: created.data.number, url: created.data.html_url };

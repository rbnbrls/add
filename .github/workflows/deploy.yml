name: Build, test, promote

on:
  push:
    branches: [main]
  # A pull-request run is what makes the committed coverage report verifiable
  # *before* the merge: the deploy jobs below are main-only (`github.ref`), so a
  # pull request only builds and tests. Without this trigger a pull request
  # carries no checks at all, and the report could only be proven stale after it
  # had already landed on main.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: add-deployment-main
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Load deployment targets
        shell: bash
        run: awk -F= '/^[A-Za-z_][A-Za-z0-9_]*=/ { print }' deployment/targets.env >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements-dev.txt

      - name: Lint backend (ruff)
        run: ruff check backend

      - name: Type-check backend (mypy)
        run: mypy backend/app

      # The coverage threshold lives here, next to the command that enforces it.
      # Measured line coverage on 2026-09-26 was 82% (see README.md); the
      # threshold sits below that so a dependency bump cannot turn a green suite
      # red without a real coverage drop.
      - name: Run backend tests with coverage
        working-directory: backend
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=75

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        run: |
          source deployment/targets.env
          export NEXT_PUBLIC_API_URL="$TEST_URL"
          cd frontend
          npm run build

      - name: Verify Docker deployment path
        run: ./scripts/verify-fresh-upgrade.sh

  deploy-test:
    name: Deploy and verify test
    needs: build-and-test
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Load deployment targets
        shell: bash
        run: awk -F= '/^[A-Za-z_][A-Za-z0-9_]*=/ { print }' deployment/targets.env >> "$GITHUB_ENV"

      - name: Trigger Coolify test deployment
        id: trigger-test
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_TEST_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TEST_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "::error title=Coolify test webhook missing::Set the repository secrets COOLIFY_TEST_WEBHOOK and COOLIFY_TEST_TOKEN (docs/deployment-coolify.md)."
            exit 1
          fi
          response_file="$(mktemp)"
          http_code="$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" --request POST "$COOLIFY_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_TOKEN")"
          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "deployed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$http_code" = "404" ] && grep -Fq 'No resources found' "$response_file"; then
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Coolify test deployment skipped::The configured Coolify webhook returned 404: no matching resource exists. Configure COOLIFY_TEST_WEBHOOK for the current test application to enable deployment verification."
            exit 0
          fi
          echo "::error title=Coolify test deployment failed::Coolify webhook returned HTTP $http_code."
          exit 1

      - name: Verify test deployment
        if: steps.trigger-test.outputs.deployed == 'true'
        env:
          DEPLOYMENT_ATTEMPTS: "36"
          DEPLOYMENT_WAIT_SECONDS: "10"
        run: DEPLOYMENT_URL="$TEST_URL" ./scripts/verify-public-deployment.sh

  deploy-production:
    name: Deploy production after test
    needs: deploy-test
    if: ${{ github.ref == 'refs/heads/main' && needs.deploy-test.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Load deployment targets
        shell: bash
        run: awk -F= '/^[A-Za-z_][A-Za-z0-9_]*=/ { print }' deployment/targets.env >> "$GITHUB_ENV"

      # rbnbrls/add has no production Coolify resource yet, so the production
      # half of the promotion gate is wired but inert: it only deploys and
      # verifies once both production secrets exist. A push to main then stays
      # green with an explicit notice instead of a red job that pretends the
      # promotion ran. Set the two secrets and the gate below enforces for real.
      - name: Check production credentials
        id: credentials
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_PRODUCTION_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_PRODUCTION_TOKEN }}
        run: |
          if [ -n "$COOLIFY_WEBHOOK" ] && [ -n "$COOLIFY_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Production promotion skipped::No production Coolify resource exists for rbnbrls/add yet; add COOLIFY_PRODUCTION_WEBHOOK and COOLIFY_PRODUCTION_TOKEN (docs/deployment-coolify.md) to enable it."
          fi

      - name: Trigger Coolify production deployment
        if: steps.credentials.outputs.available == 'true'
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_PRODUCTION_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_PRODUCTION_TOKEN }}
        run: |
          curl --fail-with-body --request POST "$COOLIFY_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"

      - name: Verify production deployment
        if: steps.credentials.outputs.available == 'true'
        env:
          DEPLOYMENT_ATTEMPTS: "36"
          DEPLOYMENT_WAIT_SECONDS: "10"
        run: DEPLOYMENT_URL="$PRODUCTION_URL" ./scripts/verify-public-deployment.sh

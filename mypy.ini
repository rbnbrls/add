# mypy configuration for the ADD backend.
#
# Run from the repository root (as CI does):  mypy backend/app
#
# The pydantic plugin is required for a schema-driven API: without it
# `model_validate`/`model_dump` are typed as returning `BaseModel`, which turns
# every call site that uses a validated schema into a false error.
# `ignore_missing_imports` keeps third-party packages that ship no type
# information from failing the gate for reasons this repository cannot fix.

[mypy]
python_version = 3.12
plugins = pydantic.mypy
ignore_missing_imports = True
files = backend/app
